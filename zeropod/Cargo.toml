[package]
name = "zeropod"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-copy pod types with derive macros. Alignment-1 representations for zero-overhead data access."

[features]
default = []
kani = []
wincode = ["dep:wincode"]
solana-address = ["dep:solana-address"]
solana-program-error = ["dep:solana-program-error"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
zeropod-derive = { workspace = true }
wincode = { version = "0.5.5", default-features = false, features = [
    "derive",
], optional = true }
solana-address = { version = ">= 2.2, <2.7", optional = true, features = [
    "copy",
] }
solana-program-error = { version = ">=1.0, <4.0", optional = true }
