[package]
name = "zeropod"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Borsh's encoding, read and written in place: zero-copy views of structs, strings, vectors, options and enums."

[features]
default = ["alloc"]
# `String`, `Vec`, and the owned `to_vec` / `from_slice`.
alloc = []
solana-address = ["dep:solana-address"]

[dependencies]
zeropod-derive.workspace = true
zerocopy = { version = "0.8", default-features = false }
solana-address = { version = ">= 2.2, < 3", optional = true, default-features = false, features = ["copy"] }

[dev-dependencies]
borsh = { version = "1", features = ["derive"] }
proptest = "1"
solana-address = { version = ">= 2.2, < 3", default-features = false, features = ["copy"] }

[lints]
workspace = true
